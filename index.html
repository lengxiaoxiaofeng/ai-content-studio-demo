<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨舟 · AI 自媒体创作平台</title>
<style>
/* ===================== Tokens ===================== */
:root{
  --accent:#07C160;
  --accent-soft:rgba(7,193,96,.10);
  --accent-line:rgba(7,193,96,.28);
  --bg:#f2f4f0;
  --bg-2:#e9ece6;
  --panel:#ffffff;
  --panel-2:#fafbf8;
  --line:#e6e9e2;
  --line-soft:#eff1ec;
  --ink:#14161a;
  --ink-2:#586070;
  --ink-3:#8b93a1;
  --rail-1:rgba(24,27,34,.86);
  --rail-2:rgba(15,17,23,.90);
  --r:12px;
  --r-sm:9px;
  --sh-1:0 1px 2px rgba(16,24,40,.04);
  --sh-2:0 2px 4px rgba(16,24,40,.04),0 10px 24px -12px rgba(16,24,40,.16);
  --sh-3:0 8px 40px -8px rgba(10,14,25,.32);
  --ease:cubic-bezier(.2,.7,.3,1);
}
html[data-platform="xhs"]{
  --accent:#FF2442;
  --accent-soft:rgba(255,36,66,.09);
  --accent-line:rgba(255,36,66,.26);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-size:13px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Inter",sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 600px at 12% -8%,rgba(255,255,255,.9),transparent 60%),
    radial-gradient(700px 500px at 100% 0%,rgba(7,193,96,.05),transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  background-attachment:fixed;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,128,140,.24);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

/* ===================== Shell ===================== */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}
@media (max-width:900px){ .app{grid-template-columns:64px 1fr} }

/* ---- glass rail ---- */
.rail{
  position:relative;display:flex;flex-direction:column;padding:14px 10px 10px;
  background:linear-gradient(180deg,var(--rail-1),var(--rail-2));
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border-right:1px solid rgba(255,255,255,.07);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.03),1px 0 24px rgba(10,14,25,.18);
  overflow:hidden;
}
.rail::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(420px 220px at 20% -10%,rgba(7,193,96,.18),transparent 60%),
    radial-gradient(300px 200px at 90% 110%,rgba(255,255,255,.05),transparent 60%);
  opacity:.9;
}
.rail>*{position:relative}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.logo{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;
  color:#04140a;background:linear-gradient(145deg,#3ee08b,var(--accent) 60%,#0aa356);
  box-shadow:0 4px 12px rgba(7,193,96,.35),inset 0 1px 0 rgba(255,255,255,.5);
}
.brand b{font-size:14px;color:#fff;letter-spacing:.4px;display:block;line-height:1.2}
.brand span{font-size:9.5px;color:rgba(255,255,255,.38);letter-spacing:1.2px}
.nav-group{font-size:9.5px;color:rgba(255,255,255,.32);letter-spacing:.14em;padding:10px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;margin-bottom:2px;
  color:rgba(255,255,255,.62);font-size:12.5px;width:100%;text-align:left;
  transition:background .16s var(--ease),color .16s var(--ease);position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.92)}
.nav-item.active{
  color:#fff;font-weight:600;
  background:linear-gradient(90deg,var(--accent-soft),rgba(255,255,255,.06));
  box-shadow:inset 2px 0 0 var(--accent),inset 0 1px 0 rgba(255,255,255,.06);
}
.nav-item svg{flex:none;opacity:.9}
.nav-item .n-badge{
  margin-left:auto;font-size:10px;font-weight:700;color:#04140a;background:var(--accent);
  border-radius:5px;padding:0 5px;line-height:15px;
}
.rail-foot{margin-top:auto;padding:10px 6px 2px;border-top:1px solid rgba(255,255,255,.07)}
.rail-card{
  display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);
  font-size:11px;color:rgba(255,255,255,.55);
}
.dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--accent)}
.dot.live{box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:900px){
  .brand b,.brand span,.nav-group,.nav-item span,.n-badge,.rail-card span{display:none}
  .nav-item{justify-content:center;padding:0}
}

/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20;
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid rgba(20,25,40,.07);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.seg{display:flex;background:rgba(240,242,237,.9);border-radius:9px;padding:3px;gap:2px;border:1px solid rgba(20,25,40,.05)}
.seg button{padding:5px 13px;border-radius:7px;font-size:12.5px;color:var(--ink-2);font-weight:500;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.10)}
.acct{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border-radius:9px;border:1px solid rgba(20,25,40,.08);background:rgba(255,255,255,.7);font-size:12.5px;transition:.15s}
.acct:hover{background:#fff;border-color:rgba(20,25,40,.14)}
.acct .av{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:linear-gradient(145deg,var(--accent),#4be08f)}
.acct .m{display:flex;flex-direction:column;line-height:1.15}
.acct .m small{font-size:9.5px;color:var(--ink-3)}
.spacer{flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.icon-btn:hover{background:rgba(20,25,40,.06);color:var(--ink)}
.agent-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;transition:.15s}
.agent-btn:hover{opacity:.88}
.agent-btn .dot{background:#39d98a}

.content{flex:1;overflow-y:auto;padding:16px 18px 56px;min-width:0}

/* ===================== Common ===================== */
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:19px;font-weight:680;letter-spacing:-.02em}
.page-head p{margin:2px 0 0;color:var(--ink-3);font-size:12px}
.page-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid transparent;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(.95)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:#cfd4cc;color:var(--ink)}
.btn-sm{height:26px;padding:0 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.card-h h3{margin:0;font-size:13px;font-weight:650}
.card-h .sub{font-size:11.5px;color:var(--ink-3)}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px}

.badge{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:#f1f3ee;color:var(--ink-2);border:1px solid #e7eae2}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.warn{background:#fff6e6;color:#a76300;border-color:#ffe6bd}
.badge.blue{background:#eaf1ff;color:#2f6fed;border-color:#dbe6ff}
.badge.red{background:#fdecec;color:#c33;border-color:#fbdcdc}
.badge.ghost{background:transparent;border-color:var(--line);color:var(--ink-3)}

/* tabs */
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:10px;padding:3px;width:fit-content;margin-bottom:14px}
.tabs button{height:28px;padding:0 14px;border-radius:8px;font-size:12.5px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.tabs button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.tabs .cnt{font-size:10px;background:#eef0ea;border-radius:4px;padding:0 5px;color:var(--ink-3);font-weight:700}

.grid{display:grid;gap:12px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1200px){.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}

.empty{text-align:center;padding:34px 16px;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-2);font-size:13px;margin-bottom:4px}

/* ===================== Topic card ===================== */
.tcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:9px;transition:.15s;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--lc,var(--accent));opacity:.85}
.tcard:hover{border-color:#d3d8ce;box-shadow:var(--sh-2);transform:translateY(-1px)}
.tcard-top{display:flex;gap:10px;align-items:flex-start}
.tcard-title{font-size:13.5px;font-weight:650;line-height:1.45;letter-spacing:-.01em}
.tcard-sig{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:var(--ink-3)}
.tcard-sig span{padding:1px 6px;border-radius:4px;background:#f4f6f1;border:1px solid #eaede5}
.tcard-score{text-align:center;flex:none}
.tcard-score b{font-size:19px;font-weight:800;color:var(--lc,var(--accent));line-height:1;display:block}
.tcard-score small{font-size:9.5px;color:var(--ink-3)}
.verdict{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;background:#f5f7f2;color:var(--ink-2)}
.verdict.good{background:#eefaf3;color:#0a7f47}
.verdict.mid{background:#fff8ea;color:#9a6100}
.verdict.bad{background:#fdeeee;color:#bf2f2f}
.verdict .conf{margin-left:auto;font-size:10.5px;font-weight:500;opacity:.72}
.tsec .lbl{font-size:10.5px;font-weight:600;color:var(--ink-3);margin-bottom:4px;display:flex;gap:5px;align-items:center}
.tsec .lbl em{font-style:normal;background:#f0f2ec;border-radius:4px;padding:0 4px;font-size:9.5px}
.fact{display:flex;flex-direction:column;gap:1px;padding:4px 0;border-bottom:1px dashed #f0f2ec}
.fact:last-child{border-bottom:none}
.fact a{font-size:11.5px;line-height:1.5;color:var(--ink);text-decoration:none;border-bottom:1px dotted #ccd2c6}
.fact a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.fsrc{font-size:10px;color:var(--ink-3)}
.ref{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;padding:4px 0}
.ref b{font-weight:650}
.ref .rd{font-size:10px;color:#a76300;background:#fff6e6;padding:0 5px;border-radius:4px;font-weight:700}
.ref .gap{width:100%;font-size:10px;color:var(--ink-3)}
.risks{display:flex;gap:5px;flex-wrap:wrap}
.risk{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;cursor:help}
.risk.high{background:#fdecec;color:#bf2f2f}
.risk.mid{background:#fff6e6;color:#a76300}
.risk.low{background:#eff2ec;color:#5b6470}
.tcard-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-soft);padding-top:9px;margin-top:2px;flex-wrap:wrap}
.trendbox{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3)}
.tacts{margin-left:auto;display:flex;gap:5px}

/* ===================== Dashboard ===================== */
.hello{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.hello h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
.hello .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.hello .right{margin-left:auto;display:flex;gap:8px}

.panel-row{display:grid;grid-template-columns:1.55fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:1200px){.panel-row{grid-template-columns:1fr}}

.today-list{display:flex;flex-direction:column}
.t-item{display:flex;gap:9px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line-soft);font-size:12px}
.t-item:last-child{border-bottom:none}
.t-item .tm{width:42px;flex:none;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;padding-top:1px}
.t-item .tt{flex:1;min-width:0}
.t-item .tt b{display:block;font-weight:600;font-size:12px;line-height:1.45;margin-bottom:3px}
.t-item .tt small{color:var(--ink-3);font-size:10.5px}
.status{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;flex:none}
.status.published{background:#e8f8ef;color:#0a8f4d}
.status.scheduled{background:#eaf1ff;color:#2f6fed}
.status.writing{background:#fff6e6;color:#a76300}
.status.idea{background:#f1f3ee;color:#7b8494}

.progress-mini{height:4px;border-radius:4px;background:#eef0ea;overflow:hidden;margin-top:6px}
.progress-mini i{display:block;height:100%;background:var(--accent);border-radius:4px}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px;color:var(--ink-2);transition:.15s;text-align:left}
.quick button:hover{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.quick button svg{color:var(--accent)}

.chain{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:10.5px;color:var(--ink-3);padding:9px 14px;background:#fafbf7;border-top:1px solid var(--line-soft);border-radius:0 0 var(--r) var(--r)}
.chain .node{padding:2px 7px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--ink-2);font-weight:500}
.chain .node.ac{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.chain .arw{color:#c8cec0}

/* ===================== Calendar ===================== */
.cal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.cal-head h3{margin:0;font-size:13.5px;font-weight:650}
.cal-nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.cal-nav button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2)}
.cal-nav button:hover{background:#f1f3ee}
.cal-nav .today-btn{width:auto;padding:0 9px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:#fff}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px 4px;gap:2px}
.cal-week span{text-align:center;font-size:10px;color:var(--ink-3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 10px}
.cal-cell{
  min-height:76px;border-radius:7px;padding:5px 5px 4px;font-size:10.5px;position:relative;
  border:1px solid transparent;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:3px;
}
.cal-cell:hover{background:#f7f9f4;border-color:var(--line)}
.cal-cell.dim{opacity:.38}
.cal-cell.today{background:var(--accent-soft);border-color:var(--accent-line)}
.cal-cell.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-cell .dnum{font-size:10.5px;font-weight:650;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.cal-cell.today .dnum{color:var(--accent)}
.cal-cell .dnum .wk{font-size:9px;color:var(--ink-3);font-weight:500}
.ev{
  display:block;font-size:9.5px;line-height:1.35;padding:2px 4px;border-radius:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;
}
.ev.published{background:#e8f8ef;color:#0a8f4d}
.ev.scheduled{background:#eaf1ff;color:#2f6fed}
.ev.writing{background:#fff6e6;color:#a76300}
.ev.idea{background:#f0f2ec;color:#6b7382}
.cal-more{font-size:9px;color:var(--ink-3);padding-left:2px}
.cal-foot{border-top:1px solid var(--line-soft);padding:10px 14px}
.cal-foot .fh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-foot .fh b{font-size:12px}
.cal-foot .fh span{font-size:10.5px;color:var(--ink-3)}
.cal-day-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:11.5px;background:#fff}
.cal-day-item:last-child{margin-bottom:0}
.cal-day-item .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-day-item .cs{font-size:9.5px;color:var(--ink-3)}

/* ===================== Studio ===================== */
.studio{display:grid;grid-template-columns:236px 1fr 320px;gap:12px;align-items:start}
@media (max-width:1200px){.studio{grid-template-columns:1fr}}
.tl-title{display:flex;flex-direction:column;gap:6px;padding:10px}
.t-item-t{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:11.5px;line-height:1.45;cursor:pointer;transition:.14s}
.t-item-t:hover{border-color:#d3d8ce;background:#fafbf8}
.t-item-t.on{border-color:var(--accent);background:var(--accent-soft)}
.t-item-t .ts{display:flex;justify-content:space-between;margin-top:5px;font-size:9.5px;color:var(--ink-3)}
.outline-i{display:flex;gap:7px;align-items:flex-start;padding:7px 10px;font-size:11.5px;color:var(--ink-2);border-bottom:1px solid var(--line-soft)}
.outline-i:last-child{border-bottom:none}
.outline-i .oi{width:14px;color:var(--ink-3);font-size:9.5px;flex:none;padding-top:1px}

.editor-card{display:flex;flex-direction:column;min-height:600px}
.toolbar{display:flex;gap:2px;padding:7px 10px;border-bottom:1px solid var(--line-soft);align-items:center;flex-wrap:wrap;background:#fafbf8}
.tool{height:25px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
.tool:hover{background:#eef1e9;color:var(--ink)}
.tool.key{color:var(--accent);font-weight:650;background:var(--accent-soft)}
.tool .sep{width:1px;height:14px;background:var(--line)}
.title-in{width:100%;border:none;outline:none;font-size:18px;font-weight:700;padding:14px 18px 4px;background:transparent;letter-spacing:-.01em}
.title-in::placeholder{color:#b7bdb2}
.meta-row{display:flex;gap:6px;padding:0 18px 10px;align-items:center;flex-wrap:wrap}
.body-in{flex:1;border:none;outline:none;resize:none;padding:6px 18px 18px;font-size:13.5px;line-height:1.9;background:transparent;min-height:360px;color:#23262c}

function toast(m){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=m;document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .2s';setTimeout(()=>el.remove(),220);},2200);
}
function spark(arr,color,w,h){
  w=w||76;h=h||22;
  const max=Math.max(...arr),min=Math.min(...arr),span=(max-min)||1;
  const pts=arr.map((v,i)=>`${(i*(w/(arr.length-1))).toFixed(1)},${(h-2-((v-min)/span)*(h-4)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="overflow:visible"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function filteredTopics(){
  const q=state.query.trim().toLowerCase();
  let list=state.topics[state.platform].filter(t=>{
    if(state.filter!=='all' && t.layer!==state.filter) return false;
    if(!q) return true;
    return (t.title+t.angle+(t.facts||[]).map(f=>f.text).join('')+(t.refs||[]).map(r=>r.account).join('')).toLowerCase().includes(q);
  });
  const score=t=>Math.round(t.heat*.3+t.match*.4+t.fresh*.2+(100-t.comp)*.1);
  const key=state.sort;
  list.sort((a,b)=> key==='score'?score(b)-score(a): b[key]-a[key]);
  return list;
}

/* ---- blocks / preview ---- */
function parseBlocks(body){
  return body.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    if(l.indexOf('> ')===0)return{type:'quote',text:l.slice(2)};
    if(l.indexOf('- ')===0)return{type:'list',text:l.slice(2)};
    if(l.length<=18)return{type:'callout',text:l};
    return{type:'paragraph',text:l};
  });
}
function renderBlocks(body,th){
  return parseBlocks(body).map(b=>{
    if(b.type==='quote')return `<blockquote style="margin:0 0 ${th.para}px;padding:9px 12px;background:${th.quoteBg};border-left:3px solid ${th.accent};border-radius:${Math.min(th.radius,7)}px;font-size:${th.fs-.5}px;line-height:${th.lh};color:#5b6470">${esc(b.text)}</blockquote>`;
    if(b.type==='list')return `<p style="margin:0 0 7px;font-size:${th.fs}px;line-height:${th.lh};padding-left:3px">· ${esc(b.text)}</p>`;
    if(b.type==='callout')return `<div style="margin:0 0 ${th.para}px;padding:10px 12px;background:${th.quoteBg};border-radius:${th.radius}px;font-size:${th.fs+1}px;line-height:1.65;font-weight:700;border-left:3px solid ${th.accent}">${esc(b.text)}</div>`;
    return `<p style="margin:0 0 ${th.para}px;font-size:${th.fs}px;line-height:${th.lh}${th.card?';background:#fff;padding:10px 12px;border-radius:'+th.radius+'px;border:1px solid #eeeae4':''}">${esc(b.text)}</p>`;
  }).join('');
}
function blockSummary(body){
  const bs=parseBlocks(body),cnt={};
  bs.forEach(b=>cnt[b.type]=(cnt[b.type]||0)+1);
  const nm={paragraph:'段落',quote:'引用',list:'列表',callout:'金句'};
  return '<span style="font-size:9.5px;color:#9aa39a">内容层</span>'+
    Object.keys(cnt).map(k=>`<span class="bc">${nm[k]} ${cnt[k]}</span>`).join('')+
    '<span style="margin-left:auto;font-size:9.5px;color:#9aa39a">换主题不改变这些块</span>';
}

      <div style="margin-top:12px;padding:10px 12px;background:#f6f8f3;border-radius:8px;font-size:11px;color:var(--ink-2);line-height:1.75">

    </div>
    <div class="modal-f"><button class="btn btn-ghost" data-act="closeModal">关闭</button>

  </div></div>`;
}

/* ================= Agent ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function renderChat(){
  $('#chat').innerHTML=state.msg.map(m=>{
    if(m.role==='user')return `<div class="msg user"><div class="av">我</div><div class="bubble">${esc(m.text)}</div></div>`;
    return `<div class="msg ai"><div class="av">墨</div><div class="bubble">${m.html||''}${m.tool||''}</div></div>`;
  }).join('');
  $('#chat').scrollTop=$('#chat').scrollHeight;
  $('#chips').innerHTML=CHIPS.map(c=>`<button class="chip" data-act="agentAsk" data-q="${esc(c)}">${esc(c)}</button>`).join('');
}
function agentToggle(open){
  state.agentOpen=open;
  $('#agent').classList.toggle('open',open);
  if(open&&!state.msg.length){
    state.msg.push({role:'ai',html:'你好，我是墨舟 Agent，接入了 <b>DeepSeek Harness</b>。<br>当前上下文：<b>'+esc(curAcct().name)+'</b> · '+esc(cfg().name)+'。<br><br>可以让我选题、写稿、排期或发布。'});
    renderChat();
  }
}
function toolCard(name,rows,extra){
  return `<div class="tool"><div class="tool-h"><span class="ok">✓</span>${esc(name)}
    <span style="margin-left:auto;font-weight:400;color:var(--ink-3)">已完成</span></div>
    <div class="tool-b">${rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join('')}${extra||''}</div></div>`;
}
function typeAI(html,tool){
  return new Promise(res=>{
    const msg={role:'ai',html:'<span class="typing"><i></i><i></i><i></i></span>',tool:''};
    state.msg.push(msg);renderChat();
    const plain=html.replace(/<br\s*\/?>/g,'\n').replace(/<[^>]+>/g,'');
    let i=0;
    const t=setInterval(()=>{
      i+=Math.max(2,Math.round(plain.length/40));
      msg.html=esc(plain.slice(0,i));renderChat();
      if(i>=plain.length){clearInterval(t);msg.html=html;if(tool)msg.tool=tool;renderChat();res();}
    },22);
  });
}
async function handleInput(text){
  if(state.busy)return;
  state.msg.push({role:'user',text});renderChat();
  state.busy=true;$('#sendBtn').disabled=true;
  await sleep(240);
  const c=cfg();
  try{
    if(/选题|写什么|热点/.test(text)){
      await typeAI('好，我用定位 + 近 90 天发文 + 今日热榜跑了一轮，按四层信号做了初判。',
        toolCard('topics.generate',[['技能','hot-events v2.1'],['去重','过滤 3 条'],['结果','5 条候选']],
          `<div class="mini-list">${state.topics[state.platform].slice(0,3).map(t=>`<div class="mini"><span>${esc(t.title.slice(0,20))}…</span><span class="s">${t.match}</span></div>`).join('')}</div>
           <div style="margin-top:7px"><button class="btn btn-sm btn-primary" data-act="tab" data-tab="topics">查看选题</button></div>`));
    } else if(/写|稿|文章/.test(text)){
      await typeAI('正在按人设起草，平台规则已加载（'+esc(c.name)+'，标题 ≤ '+c.titleMax+' 字）。',
        toolCard('contents.write',[['结构','观点型 · 6 段'],['技能','hook-library + de-ai-flavor'],['耗时','6.2s']],
          `<div style="margin-top:7px"><button class="btn btn-sm btn-primary" data-act="nav" data-view="studio">打开工坊</button></div>`));
      setTimeout(()=>{state.view='studio';render();},300);
    } else if(/去\s*ai|ai\s*味|人味/.test(text)){
      const before=state.article[state.platform].aiScore;
      state.article[state.platform].aiScore=Math.max(12,before-40);
      await typeAI('已执行 <b>de-ai-flavor v3.0</b>，只重写命中的 6 个句子，没有整篇重写。',
        toolCard('contents.humanize',[['AI 味',before+' → '+state.article[state.platform].aiScore],['命中','排比×2 / 模板词×3'],['改动','6 句']]));
      setTimeout(()=>{if(state.view==='studio')render();},300);
    } else if(/排期|日历|发布.*周/.test(text)){
      state.schedule.push({d:'2026-11-14',t:state.article[state.platform].title,s:'scheduled'});
      await typeAI('已排到 <b>11 月 14 日</b>。那天目前只有 1 项安排，间隔合适。',
        toolCard('calendar.schedule',[['日期','2026-11-14'],['账号',curAcct().name],['冲突','无']],
          `<div style="margin-top:7px"><button class="btn btn-sm btn-primary" data-act="tab" data-tab="calendar">打开日历</button></div>`));
    } else if(/数据|表现|涨粉|复盘/.test(text)){
      await typeAI('上周发了 4 篇，阅读 18,420（+23.5%），涨粉 316。最好的是定位类选题。',
        toolCard('metrics.query',[['周期','7 天'],['阅读','18,420'],['涨粉','316'],['最佳','定位/方法论 86%']],
          `<div style="margin-top:7px"><button class="btn btn-sm btn-primary" data-act="nav" data-view="analytics">打开数据</button></div>`));
    } else if(/技能/.test(text)){
      const on=state.skills.filter(s=>s.on);
      await typeAI(`当前生效 <b>${on.length}</b> 个技能，按优先级注入每次生成。`,
        toolCard('skills.list',[['生效',on.length+' 个'],['作用域','全局 + 平台 + 账号']],
          `<div class="mini-list">${on.slice(0,3).map(s=>`<div class="mini"><span>${esc(s.title)}</span><span style="margin-left:auto;color:#8b93a1;font-size:9px">v${esc(s.version)}</span></div>`).join('')}</div>`));
    } else if(/发布|群发/.test(text)){
      await typeAI('发布是高危操作，需要你确认。检查清单已跑完：',
        `<div class="tool"><div class="tool-h" style="background:#fff8e8"><span style="width:13px;height:13px;border-radius:50%;background:#c58a00;color:#fff;display:grid;place-items:center;font-size:8px">!</span>
          publish.submit <span style="margin-left:auto;font-weight:400;color:#a76300">等待确认</span></div>
          <div class="tool-b"><div class="row"><span>账号</span><b>${esc(curAcct().name)}</b></div>
          <div class="row"><span>标题</span><b>${esc(state.article[state.platform].title.slice(0,16))}…</b></div>
          <div class="row"><span>敏感词</span><b>未命中 ✓</b></div>
          <div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-sm btn-ghost" data-act="closeAgent">取消</button>
          <button class="btn btn-sm btn-primary" data-act="openPublish">去确认</button></div></div></div>`);
    } else {
      await typeAI('我在。你可以说：<br>· 帮我生成 5 个选题<br>· 把这篇去掉 AI 味<br>· 排到这周四发布<br>· 上周数据怎么样');
    }
  } finally {
    state.busy=false;$('#sendBtn').disabled=false;$('#input').focus();
  }
}

/* ================= 事件 ================= */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.classList.contains('mask')&&!e.target.classList.contains('mask'))return;
  const a=el.dataset.act;

  switch(a){
    case 'nav': state.view=el.dataset.view; closeModal(); render(); break;
    case 'tab': state.tab=el.dataset.tab; render(); break;
    case 'platform':
      if(el.dataset.p===state.platform)break;
      state.platform=el.dataset.p; render(); toast('已切换到 '+PLATFORMS[state.platform].name); break;
    case 'toggleAgent': agentToggle(!state.agentOpen); break;
    case 'closeAgent': agentToggle(false); break;
    case 'send': sendInput(); break;
    case 'agentAsk':
      if(!state.agentOpen)agentToggle(true);
      await sleep(100); handleInput(el.dataset.q); break;

    case 'filter': state.filter=el.dataset.f; render(); break;
    case 'genTopics':
      toast('正在调用 hot-events v2.1…'); await sleep(800);
      state.topics[state.platform].forEach(t=>{t.heat=Math.max(40,Math.min(99,t.heat+Math.round(Math.random()*10-5)));});
      render(); toast('已生成 5 条新选题'); break;
    case 'evidence': openEvidence(el.dataset.id); break;
    case 'schedule': {
      const t=state.topics[state.platform].find(x=>x.id===el.dataset.id);
      if(!t)break;
      const d=state.calSel;
      state.schedule.push({d,t:t.title,s:'scheduled'});
      t.status='scheduled';
      toast('已排期到 '+d); render(); break;
    }
    case 'useTopic': {
      const t=state.topics[state.platform].find(x=>x.id===el.dataset.id);
      if(t){ state.article[state.platform].title=t.title; state.brief={facts:t.facts.length,refs:t.refs.length,risks:t.risks.length}; }
      closeModal(); state.view='studio'; render(); toast('已带入选题与证据'); break;
    }

    case 'calPrev':
      state.calM--; if(state.calM<0){state.calM=11;state.calY--;} render(); break;
    case 'calNext':
      state.calM++; if(state.calM>11){state.calM=0;state.calY++;} render(); break;
    case 'calToday':
      state.calY=2026;state.calM=10;state.calSel='2026-11-08'; render(); break;
    case 'calSelect':
      state.calSel=el.dataset.date; render(); break;

    case 'radarToTopic': toast('已加入候选池'); break;

    case 'pickTitle': {
      state.article[state.platform].title=TITLES[state.platform][+el.dataset.i].t; render(); break;
    }
    case 'genTitles':
      toast('正在按 hook-library 生成…'); await sleep(600);
      TITLES[state.platform].forEach(t=>{t.s=Math.max(60,t.s+Math.round(Math.random()*8-4));});
      render(); toast('已生成新的标题候选'); break;
    case 'theme':
      state.theme[state.platform]=el.dataset.id; render();
      toast('已切换主题：'+THEMES[el.dataset.id].name+'（内容未变）'); break;
    case 'deai': {
      const art=state.article[state.platform],before=art.aiScore;
      art.aiScore=Math.max(12,before-40); render();
      toast('de-ai-flavor v3.0：'+before+' → '+art.aiScore+'，重写 6 句'); break;
    }
    case 'blocks': openBlocks(); break;
    case 'copyRich': {
      const art=state.article[state.platform],th=curTheme();
      const html='<h2>'+art.title+'</h2>'+renderBlocks(art.body,th);
      try{ await navigator.clipboard.writeText(html); toast('已复制富文本（样式已内联，粘贴到公众号不丢样式）'); }
      catch(_){ toast('已生成内联样式富文本（演示模式）'); }
      break;
    }
    case 'openPublish': openPublishModal(); break;
    case 'doPublish': {
      const c=cfg(),art=state.article[state.platform];
      state.publish.unshift({title:art.title,account:curAcct().name,
        mode:state.platform==='wechat'?'草稿箱':'图文包',
        status:state.platform==='wechat'?'已推送':'已导出',ok:true,
        time:new Date().toLocaleString('zh-CN',{hour12:false}).slice(5,16)});
      closeModal(); state.view='publish'; render();
      toast(state.platform==='wechat'?'已推送到草稿箱':'已生成图文包'); break;
    }
    case 'closeModal': closeModal(); break;

    case 'toggleSkill': {
      const s=state.skills.find(x=>x.id===el.dataset.id);
      if(s){ s.on=!s.on; closeModal(); render(); toast(s.title+(s.on?' 已启用':' 已停用')); }
      break;
    }
    case 'viewSkill': openSkillDetail(el.dataset.id); break;
    case 'evalSkill': closeModal(); await sleep(500); toast('评测完成：12/12 用例通过'); break;
    case 'uploadSkill': openUploadModal(); break;
    case 'demoImport': {
      closeModal();
      state.skills.unshift({id:'user-'+Date.now(),title:'自定义技能 · 我的标题写法',type:'writing',scope:'global',priority:50,on:false,version:'0.1.0',
        uses:0,accept:0,desc:'从本地导入，评测通过后启用。',rules:['（待补充）']});
      render(); toast('已导入，正在评测…');
      await sleep(1500);
      const s=state.skills[0]; s.on=true; s.desc='导入完成，12/12 用例通过，已启用。';
      render(); toast('评测通过，技能已启用'); break;
    }
    case 'newSkill':
      if(!state.agentOpen)agentToggle(true);
      handleInput('帮我新建一个技能：我的标题写法'); break;
    case 'savePersona': toast('人设已重新编译，全局生效'); break;

    case 'search': toast('搜索：输入关键词查选题、内容、技能'); break;
    case 'toast': toast(el.dataset.msg||'已完成'); break;
  }
});

/* 账号菜单单独处理（按钮无 data-act） */
document.addEventListener('click',e=>{
  if(e.target.closest('#accountBtn')){ openAccountMenu(); return; }
  const pick=e.target.closest('[data-act="pickAccount"]');
  if(pick){
    const a=ACCOUNTS[state.platform].find(x=>x.id===pick.dataset.id);
    if(!a||!a.auth){ toast('该账号未授权，请先完成授权'); return; }
    state.accounts[state.platform]=a.id; closeModal(); render(); toast('已切换到「'+a.name+'」');
  }
});

/* 选题搜索/排序（输入时局部刷新） */
document.addEventListener('input',e=>{
  if(e.target.id==='topicSearch'){ state.query=e.target.value; render(); const el=$('#topicSearch'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} }
  if(e.target.id==='topicSort'){ state.sort=e.target.value; render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='topicSort'){ state.sort=e.target.value; render(); }
});

function sendInput(){
  const ta=$('#input'),v=ta.value.trim();
  if(!v||state.busy)return;
  ta.value='';ta.style.height='auto';handleInput(v);
}
document.addEventListener('keydown',e=>{
  if(e.target.id==='input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendInput();}
  if(e.key==='Escape')closeModal();
  if(e.key==='/'&&!['TEXTAREA','INPUT'].includes(e.target.tagName)){e.preventDefault();if(!state.agentOpen)agentToggle(true);$('#input').focus();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='input'){e.target.style.height='auto';e.target.style.height=Math.min(84,e.target.scrollHeight)+'px';}
});

/* ================= 启动 ================= */
render(); renderChat();
</script>
